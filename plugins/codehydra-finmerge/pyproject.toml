[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codehydra-finmerge"
version = "0.1.0"
description = "FinMerge — PDF trade statement processor and tax report generator plugin for CodeHydra"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["codehydra", "plugin", "finance", "tax", "capital-gains", "itr", "pdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pdfplumber>=0.11.0",
    "httpx>=0.27.0",
]

[project.entry-points."codehydra.plugins"]
finmerge = "codehydra_finmerge:register_tools"

[tool.setuptools.packages.find]
include = ["codehydra_finmerge*"]
