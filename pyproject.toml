[project]
name = "codehydra"
version = "0.1.0"
description = "BYOS multi-CLI coding agent — route prompts across Claude, Gemini, Codex and Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.53.0",
    "mcp>=1.27.2",
    "pathspec>=1.1.1",
    "rich>=15.0.0",
    "textual>=8.2.7",
    "typer>=0.26.7",
]

[project.scripts]
codehydra = "src.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
