[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codehydra"
version = "0.1.0"
description = "BYOS multi-CLI coding agent — route prompts across Claude, Gemini, Codex and Ollama"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["ai", "llm", "cli", "agent", "tui", "claude", "gemini", "codex", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "google-auth>=2.53.0",
    "mcp>=1.27.2",
    "pathspec>=1.1.1",
    "rich>=15.0.0",
    "textual>=8.2.7",
    "textual-serve>=1.1.3",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://github.com/ativin4/codehydra"
Repository = "https://github.com/ativin4/codehydra"
Issues = "https://github.com/ativin4/codehydra/issues"

[project.scripts]
codehydra = "codehydra.cli:main"

[tool.setuptools.packages.find]
include = ["codehydra*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "build>=1.0",
    "twine>=5.0",
]
